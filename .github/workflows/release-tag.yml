name: Release tag

on:
  push:
    tags: ["**"]

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      # v[YY].[MM], with an optional hotfix number: v26.03, v26.03.1
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]{2}\.(0[1-9]|1[0-2])(\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Tag '$TAG' does not follow v[YY].[MM] or v[YY].[MM].[N], see README.md"
            exit 1
          fi
