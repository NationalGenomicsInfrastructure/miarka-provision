

- name: create directory for {{ pipeline }}  resources
  file:
    path: "{{ ngi_containers }}/{{ pipeline }}"
    state: directory

- name: download DADA2 reference taxonomy databases
  get_url:
    url: "{{ item.url }}"
    dest: "{{ ngi_containers }}/{{ pipeline }}/{{ item.file }}"
  loop: "{{ extra_parameters.databases | map(attribute='files') | flatten }}"
